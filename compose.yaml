services:
  frontend:
    build: ./frontend

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      
    environment:
       NEXT_PUBLIC_BACKEND_URL: http://localhost:4000

    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://game_user:local_password@database:5432/game_db
      FRONTEND_ORIGIN: http://localhost:3000
    depends_on:
      - database

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: game_user
      POSTGRES_PASSWORD: local_password
      POSTGRES_DB: game_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  frontend_node_modules:
  backend_node_modules:
  postgres_data: